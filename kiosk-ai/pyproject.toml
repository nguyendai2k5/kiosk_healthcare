[project]
name = "kiosk-ai"
version = "0.1.0"
description = "Kiosk healthcare monorepo scaffold"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
]

[tool.uv]
package = false

[tool.uv.sources]
kiosk-contracts = { workspace = true }
kiosk-common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pre-commit>=3.7,<4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["packages", "services"]
