[project]
name = "kiosk_contracts"
version = "0.1.0"
description = "Shared Pydantic models for the kiosk platform"
requires-python = ">=3.12"
dependencies = ['pydantic>=2.10,<3']

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiosk_contracts"]
